<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Discovery - DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <!-- Leaflet.js GIS map components -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .compare-bar {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-md);
        }
        .compare-bar.hidden {
            display: none !important;
        }

        /* ── Map Marker Animations ── */
        .map-top1-pulse {
            animation: pulseGlow 2s infinite ease-in-out;
            z-index: 1000 !important;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.6)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.9)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.6)); }
        }
        .map-marker-bounce {
            animation: markerBounce 0.5s ease-in-out 2;
        }
        @keyframes markerBounce {
            0%, 100% { transform: translateY(0) scale(1.1); }
            50% { transform: translateY(-10px) scale(1.2); }
        }
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .prop-card {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        .prop-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            border-color: #4f46e5;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-tenant">
        <div class="navbar-container">
            <div class="navbar-brand-group">
                <a href="dashboard.html" style="text-decoration: none;"><span class="navbar-logo">DomiKnow</span></a>
                <span class="navbar-badge navbar-badge-tenant">Tenant</span>
            </div>
            <div class="navbar-menu">
                <a href="dashboard.html" class="navbar-menu-link">Dashboard</a>
                <a href="properties.html" class="navbar-menu-link active">Discovery</a>
                <a href="recommendations.html" class="navbar-menu-link">Recommendations</a>
                <a href="applications.html" class="navbar-menu-link">My Applications</a>
            </div>
            <div class="navbar-right">
                <span class="navbar-user-welcome">Welcome, <span class="user-name">User</span></span>
                <button id="logoutBtn" class="navbar-btn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <h2>Explore Approved Listings</h2>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div id="generalFeedback" class="alert alert-success hidden" style="margin-bottom: 0; padding: 0.5rem 1rem;"></div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="sortBy" style="font-size: 0.875rem; font-weight: 600; color: var(--text-secondary);">Sort by:</label>
                    <select id="sortBy" class="form-select" style="width: auto; padding: 0.375rem 0.75rem;">
                        <option value="newest">Newest First</option>
                        <option value="price_asc">Price: Low to High</option>
                        <option value="price_desc">Price: High to Low</option>
                        <option value="rating_desc">Highest Rated</option>
                    </select>
                </div>
            </div>
        </div>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Find the best rental suited to your requirements in Siniloan, Laguna.</p>



        <div class="properties-layout">
            <!-- Left Column: Filters -->
            <aside class="filter-card">
                <h3 class="filter-title">Filter Options</h3>
                
                <div class="filter-section">
                    <label class="form-label" for="searchBar">Search Keywords</label>
                    <input type="text" id="searchBar" placeholder="Search name or rules..." class="form-input">
                </div>

                <div class="filter-section">
                    <label class="form-label" for="filterBarangay">Barangay</label>
                    <select id="filterBarangay" class="form-select">
                        <option value="">All Barangays</option>
                        <option value="G. Redor">G. Redor</option>
                        <option value="Halayhayin">Halayhayin</option>
                        <option value="Pandeño">Pandeño</option>
                        <option value="Macasipac">Macasipac</option>
                        <option value="Acevida">Acevida</option>
                        <option value="Mendiola">Mendiola</option>
                        <option value="Salubungan">Salubungan</option>
                    </select>
                </div>

                <div class="filter-section">
                    <label class="form-label" for="filterType">Property Type</label>
                    <select id="filterType" class="form-select">
                        <option value="">All Types</option>
                        <option value="apartment">Apartment</option>
                        <option value="boarding_house">Boarding House</option>
                        <option value="bedspace">Bedspace</option>
                    </select>
                </div>


                <div class="filter-section">
                    <label class="form-label" for="filterSuit">Tenant Suitability</label>
                    <select id="filterSuit" class="form-select">
                        <option value="">All Suitability</option>
                        <option value="student">Student</option>
                        <option value="worker">Worker</option>
                        <option value="family">Family</option>
                        <option value="general">General</option>
                    </select>
                </div>

                <div class="filter-section">
                    <label class="form-label">Price Bounds (Monthly)</label>
                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="number" id="filterMinPrice" placeholder="Min ₱" class="form-input" style="padding: 0.5rem;">
                        <span style="color: var(--text-muted); font-size: 0.8125rem;">to</span>
                        <input type="number" id="filterMaxPrice" placeholder="Max ₱" class="form-input" style="padding: 0.5rem;">
                    </div>
                </div>

                <div class="filter-section">
                    <label class="form-label" for="filterRating">Minimum Rating</label>
                    <select id="filterRating" class="form-select">
                        <option value="">No Minimum</option>
                        <option value="4.5">★ 4.5 & up</option>
                        <option value="4.0">★ 4.0 & up</option>
                        <option value="3.5">★ 3.5 & up</option>
                    </select>
                </div>

                <div class="filter-section">
                    <label class="form-label">Key Amenities</label>
                    <div class="amenity-checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="WiFi"> WiFi</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="CCTV"> CCTV</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Parking"> Parking</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Kitchen Access"> Kitchen Access</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Laundry Area"> Laundry Area</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Air Conditioning"> Aircon</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Own CR"> Own CR</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Study Area"> Study Area</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Near School"> Near School</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Near Market"> Near Market</label>
                        <label class="checkbox-label"><input type="checkbox" class="amenity-filter" value="Pet Friendly"> Pet Friendly</label>
                    </div>
                </div>

                <button id="btnClearFilters" class="navbar-btn" style="width: 100%; margin-top: 0.5rem; justify-content: center; font-weight: 700; color: var(--primary);">Clear All Filters</button>
            </aside>

            <!-- Right Column: Map and Listings -->
            <div class="discovery-main">
                <!-- GIS Map Card -->
                <div class="map-card">
                    <div id="map"></div>
                </div>

                <!-- Catalog Grid -->
                <div id="propertiesGrid" class="property-grid">
                    <p style="text-align: center; color: var(--text-muted); grid-column: 1/-1;">Searching properties...</p>
                </div>
            </div>
        </div>
    </main>



    <script src="../../js/auth.js"></script>
    <script src="../../js/dashboard.js"></script>
    <script>
        const token = localStorage.getItem('domiknow_token');
        let mapInstance = null;
        let markersGroup = null;
        let userLocationMarker = null;
        let selectedPropertyIds = [];
        let allProperties = [];
        let currentPage = 1;
        let totalPages = 1;

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Leaflet Map centered in Siniloan, Laguna
            mapInstance = L.map('map').setView([14.425, 121.440], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(mapInstance);
            
            markersGroup = L.layerGroup().addTo(mapInstance);

            // Default map center: Siniloan Town Center
            mapInstance.setView([14.4172, 121.4475], 14);

            // Bind Event Listeners for Filters
            document.getElementById('searchBar').addEventListener('input', applyFilters);
            document.getElementById('filterBarangay').addEventListener('change', applyFilters);
            document.getElementById('filterType').addEventListener('change', applyFilters);
            document.getElementById('filterSuit').addEventListener('change', applyFilters);
            document.getElementById('filterMinPrice').addEventListener('input', applyFilters);
            document.getElementById('filterMaxPrice').addEventListener('input', applyFilters);
            document.getElementById('filterRating').addEventListener('change', applyFilters);
            document.querySelectorAll('.amenity-filter').forEach(cb => cb.addEventListener('change', applyFilters));
            document.getElementById('sortBy').addEventListener('change', applyFilters);
            
            document.getElementById('btnClearFilters').addEventListener('click', clearFilters);
            
            if (document.getElementById('btnCompareGo')) {
                document.getElementById('btnCompareGo').addEventListener('click', goCompare);
            }

            // Event delegation for compare checkboxes (bypasses CSP)
            document.getElementById('propertiesGrid').addEventListener('change', (e) => {
                const cb = e.target.closest('.compare-cb');
                if (cb) {
                    const id = cb.value;
                    toggleCompare(cb, id);
                }
            });

            // Initial Fetch
            fetchProperties();
        });

        // Fetch properties with 5 Input Criteria passed to the Ranked Recommendation Engine
        async function fetchProperties() {
            try {
                const search = document.getElementById('searchBar')?.value || '';
                const barangay = document.getElementById('filterBarangay')?.value || '';
                const type = document.getElementById('filterType')?.value || '';
                const suit = document.getElementById('filterSuit')?.value || '';
                const minPrice = document.getElementById('filterMinPrice')?.value || '';
                const maxPrice = document.getElementById('filterMaxPrice')?.value || '';
                const sort = document.getElementById('sortBy')?.value || 'newest';

                const activeAmenities = [];
                document.querySelectorAll('.amenity-filter:checked').forEach(cb => {
                    activeAmenities.push(cb.value);
                });

                let queryParams = `preferred_location=${encodeURIComponent(barangay || search)}&min_price=${minPrice}&max_price=${maxPrice}&preferred_property_type=${type}&tenant_preference=${suit}&sort=${sort}`;
                activeAmenities.forEach(a => {
                    queryParams += `&amenities=${encodeURIComponent(a)}`;
                });

                const headers = {};
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch(`/api/properties/recommendations/ranked?${queryParams}`, { headers });

                if (!response.ok) {
                    document.getElementById('propertiesGrid').innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--error);">Failed to load recommended listings.</p>`;
                    return;
                }

                const result = await response.json();
                allProperties = result.data || [];
                renderUI(allProperties);

            } catch (err) {
                console.error(err);
                document.getElementById('propertiesGrid').innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--error);">Error loading properties API.</p>`;
            }
        }

        // Barangay geographic boundary polygons lookup for Siniloan, Laguna
        function getBarangayPolygon(barangayName) {
            const key = (barangayName || '').trim().toLowerCase();
            const predefinedPolygons = {
                'halayhayin': [
                    [14.4320, 121.4380], [14.4340, 121.4460], [14.4260, 121.4500], [14.4200, 121.4450], [14.4210, 121.4390]
                ],
                'acevida': [
                    [14.4170, 121.4460], [14.4180, 121.4520], [14.4090, 121.4550], [14.4050, 121.4490], [14.4110, 121.4450]
                ],
                'g. redor': [
                    [14.4200, 121.4455], [14.4205, 121.4485], [14.4150, 121.4495], [14.4145, 121.4460]
                ],
                'macatad': [
                    [14.4330, 121.4500], [14.4340, 121.4600], [14.4240, 121.4610], [14.4230, 121.4510]
                ],
                'wawa': [
                    [14.4140, 121.4410], [14.4150, 121.4470], [14.4070, 121.4480], [14.4060, 121.4420]
                ],
                'salubungan': [
                    [14.4350, 121.4550], [14.4360, 121.4630], [14.4280, 121.4640], [14.4270, 121.4560]
                ],
                'pandeño': [
                    [14.4440, 121.4630], [14.4450, 121.4720], [14.4360, 121.4730], [14.4350, 121.4640]
                ]
            };

            if (predefinedPolygons[key]) return predefinedPolygons[key];

            const barangayCoords = {
                'bagong pag-asa': [14.4172, 121.4475],
                'bagumayan': [14.4168, 121.4480],
                'i. mendiola': [14.4180, 121.4465],
                'mercado': [14.4165, 121.4472],
                'p. burgos': [14.4150, 121.4460],
                'magsaysay': [14.4190, 121.4485],
                'castro': [14.4220, 121.4520],
                'laguio': [14.4330, 121.4600],
                'liyang': [14.4380, 121.4650],
                'pandeno': [14.4400, 121.4680],
                'llavac': [14.4480, 121.4750],
                'kapatalan': [14.4550, 121.4820],
                'kalaiya': [14.4600, 121.4880],
                'maybo': [14.4350, 121.4500]
            };

            const center = barangayCoords[key] || [14.4172, 121.4475];
            const lat = center[0];
            const lon = center[1];
            return [
                [lat + 0.0040, lon - 0.0050],
                [lat + 0.0045, lon + 0.0040],
                [lat + 0.0010, lon + 0.0055],
                [lat - 0.0040, lon + 0.0045],
                [lat - 0.0042, lon - 0.0040],
                [lat - 0.0010, lon - 0.0052]
            ];
        }

        function renderUI(items) {
            const grid = document.getElementById('propertiesGrid');
            grid.innerHTML = '';
            
            // Clear prior markers
            markersGroup.clearLayers();

            // Highlight Barangay Boundary Polygon with Red Dotted Line (matching user request)
            const selectedBarangay = document.getElementById('filterBarangay')?.value || '';
            const polyTarget = selectedBarangay || 'Siniloan';
            const polyCoords = getBarangayPolygon(polyTarget);
            
            const barangayPoly = L.polygon(polyCoords, {
                color: '#ef4444',       // Red outline border (matching attachment screenshot)
                weight: 3.5,            // Bold line stroke
                opacity: 0.95,
                fillColor: '#ef4444',   // Soft red area fill
                fillOpacity: 0.1,       // Transparent fill overlay
                dashArray: '5, 5'       // Dotted/dashed border pattern
            }).addTo(markersGroup);

            const displayLabel = selectedBarangay ? `Barangay ${selectedBarangay}` : 'Siniloan Municipality';
            barangayPoly.bindPopup(`
                <div style="font-weight: 800; font-size: 0.88rem; color: #dc2626; padding: 2px;">
                    📍 ${displayLabel} Boundary Line
                </div>
            `);

            if (!items || items.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem 0;">No approved properties match your active filter criteria.</p>`;
                return;
            }

            const markers = [];
            const markerMap = {};

            items.forEach(item => {
                const prop = item.property || item;
                const rank = item.rank || 1;
                const matchPct = item.match_percentage || 85;
                const out = item.output_criteria || {};
                
                // Amenities HTML preview
                let amenHtml = '';
                const amenitiesList = prop.amenities || [];
                const preview = amenitiesList.slice(0, 3);
                preview.forEach(a => {
                    amenHtml += `<span class="badge-amenity">${a}</span>`;
                });
                if (amenitiesList.length > 3) {
                    amenHtml += `<span class="badge-amenity">+${amenitiesList.length - 3}</span>`;
                }

                const card = document.createElement('div');
                card.className = 'prop-card';
                card.dataset.propId = prop.id;
                
                card.innerHTML = `
                    <div class="prop-img-wrapper" style="position: relative;">
                        <img src="${prop.main_image_url || 'https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=400&q=80'}" alt="${prop.property_name}" class="prop-img">
                        <span style="position: absolute; top: 10px; left: 10px; background: ${rank === 1 ? 'linear-gradient(135deg, #10b981 0%, #059669 100%)' : '#4f46e5'}; color: white; padding: 0.2rem 0.65rem; border-radius: 999px; font-weight: 800; font-size: 0.72rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                            ${rank === 1 ? '🏆 Rank #1 Top Match' : `Rank #${rank}`}
                        </span>
                        <span class="reco-score-badge" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                            ${matchPct}% Match
                        </span>
                    </div>

                    <div class="prop-content">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
                            <span style="font-size: 0.725rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em;">
                                ${(prop.property_type || '').replace('_', ' ')}
                            </span>
                            <span style="font-weight: 800; font-size: 0.95rem; color: #4f46e5;">₱${parseInt(prop.monthly_rent || 0).toLocaleString()}/mo</span>
                        </div>

                        <h4 class="prop-title" style="margin: 0.25rem 0;">${prop.property_name}</h4>
                        
                        <!-- 5 Output Criteria Badges Display Grid -->
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem; margin: 0.65rem 0; background: var(--bg-primary); padding: 0.6rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">1. Location</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-primary); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Brgy. ${prop.barangay}</div>
                            </div>
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">2. Property Rating</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: #f59e0b;">★ ${(out.property_rating || prop.average_rating || 4.8).toFixed(1)} / 5.0</div>
                            </div>
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">3. Trust Score</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: #059669;">🛡️ ${out.trust_score || 100} / 100</div>
                            </div>
                            <div>
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">4. Reliability</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: #0284c7;">⚡ ${out.rental_reliability || '96% High'}</div>
                            </div>
                            <div style="grid-column: span 2;">
                                <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">5. Landlord Rating</span>
                                <div style="font-size: 0.78rem; font-weight: 700; color: #8b5cf6;">👨‍💼 ${(out.landlord_rating || 4.7).toFixed(1)} / 5.0</div>
                            </div>
                        </div>

                        <div class="prop-amenities-preview" style="margin-bottom: 0.75rem;">${amenHtml}</div>

                        <div style="display: flex; align-items: center; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 0.75rem; margin-top: 0.5rem;">
                            <a href="property-details.html?id=${prop.id}" class="btn-prop-detail" style="width: 100%; text-align: center; padding: 0.5rem 1.25rem; font-size: 0.875rem; font-weight: 700; border-radius: var(--radius-md); text-decoration: none;">View Details &amp; Reserve</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);

                // Add Custom Animated Leaflet Marker
                if (prop.latitude && prop.longitude) {
                    const lat = parseFloat(prop.latitude);
                    const lng = parseFloat(prop.longitude);

                    const markerIcon = L.divIcon({
                        className: '',
                        html: rank === 1
                            ? `<div class="map-top1-pulse" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: 2.5px solid white; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; box-shadow: 0 4px 14px rgba(16,185,129,0.6);">#1</div>`
                            : `<div class="marker-inner" style="background: #3b82f6; color: white; border: 2px solid white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.25);">#${rank}</div>`,
                        iconSize: rank === 1 ? [38, 38] : [30, 30],
                        iconAnchor: rank === 1 ? [19, 19] : [15, 15]
                    });

                    const marker = L.marker([lat, lng], { icon: markerIcon })
                        .bindPopup(`
                            <div style="font-family: var(--font-family); padding: 0.35rem 0.25rem;">
                                <span style="background: ${rank === 1 ? '#10b981' : '#4f46e5'}; color: white; padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 800; font-size: 0.72rem;">${rank === 1 ? '🏆 Top Match' : `Rank #${rank}`} (${matchPct}% Match)</span>
                                <h4 style="margin: 0.4rem 0 0.25rem 0; font-weight: 800; color: var(--primary); font-size: 0.95rem;">${prop.property_name}</h4>
                                <p style="margin: 0; font-size: 0.82rem; font-weight: 700; color: #4f46e5;">₱${parseInt(prop.monthly_rent || 0).toLocaleString()}/month</p>
                                <p style="margin: 0.2rem 0 0.5rem 0; font-size: 0.78rem; color: #059669; font-weight: 700;">🛡️ Trust Score: ${out.trust_score || 100}/100</p>
                                <a href="property-details.html?id=${prop.id}" style="font-size: 0.78rem; font-weight: 800; text-decoration: none; color: white; background: #4f46e5; padding: 0.35rem 0.75rem; border-radius: 6px; display: inline-block;">Open Details →</a>
                            </div>
                        `);
                    
                    markersGroup.addLayer(marker);
                    markers.push(marker);
                    markerMap[prop.id] = { marker, lat, lng };
                }

                // Card Hover & Click Interactive Map Animations
                card.addEventListener('mouseenter', () => {
                    const data = markerMap[prop.id];
                    if (data && data.marker) {
                        const iconElement = data.marker.getElement();
                        if (iconElement) {
                            const innerDiv = iconElement.querySelector('div');
                            if (innerDiv) innerDiv.classList.add('map-marker-bounce');
                        }
                    }
                });

                card.addEventListener('mouseleave', () => {
                    const data = markerMap[prop.id];
                    if (data && data.marker) {
                        const iconElement = data.marker.getElement();
                        if (iconElement) {
                            const innerDiv = iconElement.querySelector('div');
                            if (innerDiv) innerDiv.classList.remove('map-marker-bounce');
                        }
                    }
                });

                card.addEventListener('click', (e) => {
                    // Avoid triggering when clicking View Details link
                    if (e.target.closest('a')) return;
                    const data = markerMap[prop.id];
                    if (data && data.marker) {
                        mapInstance.flyTo([data.lat, data.lng], 16, {
                            animate: true,
                            duration: 1.2,
                            easeLinearity: 0.25
                        });
                        data.marker.openPopup();
                    }
                });
            });

            // Smooth animated camera transition to fit all property markers
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                mapInstance.flyToBounds(group.getBounds().pad(0.15), {
                    animate: true,
                    duration: 1.4,
                    easeLinearity: 0.25
                });
            }
        }

        // Apply filters dynamically by re-querying the recommendation API with active Filter Options
        function applyFilters() {
            fetchProperties();
        }

        function clearFilters() {
            document.getElementById('searchBar').value = '';
            document.getElementById('filterBarangay').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterSuit').value = '';
            document.getElementById('filterMinPrice').value = '';
            document.getElementById('filterMaxPrice').value = '';
            document.getElementById('filterRating').value = '';
            document.querySelectorAll('.amenity-filter').forEach(cb => cb.checked = false);
            
            fetchProperties();
        }

        // Comparison Handler
        function toggleCompare(cb, id) {
            if (cb.checked) {
                if (selectedPropertyIds.length >= 4) {
                    cb.checked = false;
                    alert('You can compare maximum 4 properties.');
                    return;
                }
                selectedPropertyIds.push(id);
            } else {
                selectedPropertyIds = selectedPropertyIds.filter(pid => pid !== id);
            }

            updateCompareBar();
        }

        function updateCompareBar() {
            const bar = document.getElementById('compareBar');
            const count = document.getElementById('compareCount');
            
            count.textContent = selectedPropertyIds.length;

            if (selectedPropertyIds.length >= 2) {
                bar.classList.remove('hidden');
            } else {
                bar.classList.add('hidden');
            }
        }

        function goCompare() {
            if (selectedPropertyIds.length < 2) return;
            const query = selectedPropertyIds.map(id => `id=${id}`).join('&');
            window.location.href = `compare.html?${query}`;
        }


    </script>
</body>
</html>
