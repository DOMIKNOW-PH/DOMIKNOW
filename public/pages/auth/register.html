<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DOMIKNOW LIGHT MODE COLOR PALETTE (From Specs) */
            --bg-color: #F8FAFC;          /* Primary Background (50-55%) */
            --surface: #FFFFFF;           /* Surface (25-30%) */
            --primary-dark: #042458;      /* Primary Dark (10-15% - Headings, nav, text) */
            --primary-action: #0355F3;    /* Primary Action (5-10% - Buttons, links, highlights) */
            --primary-action-hover: #0244C4;

            --primary: #042458;
            --accent: #0355F3;
            --soft-pink: #EDF4FE;
            --text-dark: #042458;
            --text-normal: #042458;
            --text-muted: #475569;
            --border-color: rgba(4, 36, 88, 0.14);
            --card-shadow: 0 25px 60px rgba(4, 36, 88, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }

        h1, h2, h3, h4, .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .back-to-home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-dark);
            font-weight: 700;
            text-decoration: none;
            font-size: 0.875rem;
            background: var(--surface);
            padding: 0.55rem 1.15rem;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(4, 36, 88, 0.04);
            transition: all 0.25s ease;
            width: max-content;
        }

        .back-to-home-link:hover {
            color: var(--primary-action);
            border-color: var(--primary-action);
            transform: translateX(-4px);
        }

        .auth-card {
            background: var(--surface);
            border-radius: 28px;
            padding: 2.75rem 2.25rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #042458 0%, #0355F3 100%);
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(3, 85, 243, 0.3);
        }

        .auth-logo-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: -0.03em;
            margin-bottom: 0.35rem;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .auth-link {
            color: var(--primary-action);
            font-weight: 800;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: var(--primary-action-hover);
            text-decoration: underline;
        }

        .form-label {
            font-weight: 800;
            font-size: 0.75rem;
            color: var(--primary-dark);
            margin-bottom: 0.4rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            background: var(--surface);
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            padding: 0.8rem 1rem;
            font-size: 0.9375rem;
            color: var(--primary-dark);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary-action);
            box-shadow: 0 0 0 4px rgba(3, 85, 243, 0.15);
        }

        .form-help {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            display: block;
        }

        .btn-primary {
            background-color: var(--primary-action);
            color: white;
            font-weight: 800;
            font-size: 0.9375rem;
            padding: 0.9rem;
            border-radius: 12px;
            transition: all 0.25s ease;
            width: 100%;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(3, 85, 243, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-action-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(3, 85, 243, 0.4);
        }

        /* Role Selector Pills */
        .role-selector-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-top: 0.25rem;
        }

        .role-pill-btn {
            padding: 0.65rem 0.5rem;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: var(--bg-color);
            color: var(--primary-dark);
            font-size: 0.8125rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .role-pill-btn.active {
            background: var(--primary-action);
            color: white;
            border-color: var(--primary-action);
            box-shadow: 0 4px 14px rgba(3, 85, 243, 0.35);
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <a href="../../index.html" class="back-to-home-link">
            <span>← Back to Home</span>
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo-title">Create Account</h1>
                <p class="auth-subtitle">
                    Register to get started on DomiKnow. Already registered?
                    <a href="login.html" class="auth-link">Sign in</a>
                </p>
            </div>

            <div id="errorMessage" class="alert alert-danger hidden" style="border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; background: #fef2f2; border: 1px solid #fecaca; padding: 1rem; color: #b91c1c;">
                <span class="alert-text" style="font-size: 0.875rem; font-weight: 600;">Error message</span>
            </div>

            <div id="successMessage" class="alert alert-success hidden" style="border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; background: #ecfdf5; border: 1px solid #a7f3d0; padding: 1rem; color: #065f46;">
                <span class="alert-text" style="font-size: 0.875rem; font-weight: 600;">Success message</span>
            </div>

            <form id="registerForm" novalidate style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name *</label>
                    <input id="full_name" name="full_name" type="text" required 
                           placeholder="John Doe" class="form-input"
                           minlength="2" maxlength="255">
                    <small class="form-error" id="full_name_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address *</label>
                    <input id="email" name="email" type="email" required 
                           placeholder="john@example.com" class="form-input">
                    <small class="form-error" id="email_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password *</label>
                    <div style="position: relative;">
                        <input id="password" name="password" type="password" required 
                               placeholder="••••••••" class="form-input"
                               minlength="8">
                        <button type="button" id="togglePassword" 
                                style="position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); 
                                       background: none; border: none; cursor: pointer; font-size: 0.8125rem; 
                                       color: var(--primary-action); font-weight: 800;">
                            Show
                        </button>
                    </div>
                    <small class="form-help">Must be at least 8 characters with uppercase, lowercase, and number</small>
                    <small class="form-error" id="password_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
                    <div id="passwordStrength" style="margin-top: 0.5rem;"></div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password *</label>
                    <input id="confirm_password" name="confirm_password" type="password" required 
                           placeholder="••••••••" class="form-input">
                    <small class="form-error" id="confirm_password_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
                </div>

                <div class="form-group">
                    <label class="form-label">Account Role *</label>
                    <input type="hidden" id="role" name="role" value="tenant">
                    <div class="role-selector-grid">
                        <div class="role-pill-btn active" data-role="tenant" onclick="selectRole('tenant')">
                            <span>Tenant</span>
                        </div>
                        <div class="role-pill-btn" data-role="landlord" onclick="selectRole('landlord')">
                            <span>Landlord</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="contact_number" class="form-label">Contact Number (Optional)</label>
                    <input id="contact_number" name="contact_number" type="tel" placeholder="+63 900 000 0000" class="form-input">
                </div>

                <div class="form-group">
                    <label for="address" class="form-label">Address (Optional)</label>
                    <textarea id="address" name="address" rows="2" placeholder="Your street address in Siniloan, Laguna" class="form-textarea"></textarea>
                </div>

                <div class="form-group" style="margin-top: 0.5rem;">
                    <button type="submit" id="submitBtn" class="btn-primary">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script>
        const form = document.getElementById('registerForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        
        function selectRole(roleVal) {
            document.getElementById('role').value = roleVal;
            document.querySelectorAll('.role-pill-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-role') === roleVal);
            });
        }

        // Toggle password visibility
        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            confirmPasswordInput.type = type;
            this.textContent = type === 'password' ? 'Show' : 'Hide';
        });
        
        // Password strength indicator
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (!password) {
                strengthDiv.innerHTML = '';
                return;
            }
            
            let strength = 0;
            let feedback = [];
            
            if (password.length >= 8) strength++;
            else feedback.push('at least 8 characters');
            
            if (/[a-z]/.test(password)) strength++;
            else feedback.push('lowercase letter');
            
            if (/[A-Z]/.test(password)) strength++;
            else feedback.push('uppercase letter');
            
            if (/\d/.test(password)) strength++;
            else feedback.push('number');
            
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            const colors = ['#ef4444', '#f59e0b', '#eab308', '#84cc16', '#0355F3'];
            const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
            
            strengthDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 100px; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden;">
                        <div style="width: ${strength * 20}%; height: 100%; background: ${colors[strength - 1] || colors[0]}; transition: all 0.3s;"></div>
                    </div>
                    <span style="font-size: 0.75rem; color: ${colors[strength - 1] || colors[0]}; font-weight: 800;">
                        ${labels[strength - 1] || labels[0]}
                    </span>
                </div>
                ${feedback.length > 0 ? `<small style="color: var(--text-muted); font-size: 0.725rem; display: block; margin-top: 0.25rem;">Need: ${feedback.join(', ')}</small>` : ''}
            `;
        });
        
        // Client-side validation
        function validateForm() {
            let isValid = true;
            
            // Clear previous errors
            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-input, .form-select, .form-textarea').forEach(el => {
                el.style.borderColor = '';
            });
            
            // Full name validation
            const fullName = document.getElementById('full_name').value.trim();
            if (!fullName) {
                showFieldError('full_name', 'Full name is required');
                isValid = false;
            } else if (fullName.length < 2) {
                showFieldError('full_name', 'Full name must be at least 2 characters');
                isValid = false;
            } else if (fullName.length > 255) {
                showFieldError('full_name', 'Full name is too long');
                isValid = false;
            }
            
            // Email validation
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                showFieldError('email', 'Email is required');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                showFieldError('email', 'Please enter a valid email address');
                isValid = false;
            }
            
            // Password validation
            const password = document.getElementById('password').value;
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (!password) {
                showFieldError('password', 'Password is required');
                isValid = false;
            } else if (!passwordRegex.test(password)) {
                showFieldError('password', 'Password must be at least 8 characters with uppercase, lowercase, and number');
                isValid = false;
            }
            
            // Confirm password validation
            const confirmPassword = document.getElementById('confirm_password').value;
            if (!confirmPassword) {
                showFieldError('confirm_password', 'Please confirm your password');
                isValid = false;
            } else if (password !== confirmPassword) {
                showFieldError('confirm_password', 'Passwords do not match');
                isValid = false;
            }
            
            return isValid;
        }
        
        function showFieldError(fieldId, message) {
            const errorEl = document.getElementById(`${fieldId}_error`);
            const inputEl = document.getElementById(fieldId);
            if (errorEl) errorEl.textContent = message;
            if (inputEl) inputEl.style.borderColor = '#ef4444';
        }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate form
            if (!validateForm()) {
                return;
            }
            
            // Call existing handleRegister function
            await handleRegister(e);
        });
    </script>
</body>
</html>
