<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DomiKnow</title>
    <link href="../../css/input.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DOMIKNOW LIGHT MODE COLOR PALETTE (From Specs) */
            --bg-color: #F8FAFC;          /* Primary Background (50-55%) */
            --surface: #FFFFFF;           /* Surface (25-30%) */
            --primary-dark: #042458;      /* Primary Dark (10-15% - Headings, nav, text) */
            --primary-action: #0355F3;    /* Primary Action (5-10% - Buttons, links, highlights) */
            --primary-action-hover: #0244C4;

            --primary: #042458;
            --accent: #0355F3;
            --soft-pink: #EDF4FE;
            --text-dark: #042458;
            --text-normal: #042458;
            --text-muted: #475569;
            --border-color: rgba(4, 36, 88, 0.14);
            --card-shadow: 0 25px 60px rgba(4, 36, 88, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        h1, h2, h3, h4, .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .back-to-home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-dark);
            font-weight: 700;
            text-decoration: none;
            font-size: 0.875rem;
            background: var(--surface);
            padding: 0.55rem 1.15rem;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(4, 36, 88, 0.04);
            transition: all 0.25s ease;
            width: max-content;
        }

        .back-to-home-link:hover {
            color: var(--primary-action);
            border-color: var(--primary-action);
            transform: translateX(-4px);
        }

        .auth-card {
            background: var(--surface);
            border-radius: 28px;
            padding: 2.75rem 2.25rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #042458 0%, #0355F3 100%);
            color: white;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(3, 85, 243, 0.3);
        }

        .auth-logo-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: -0.03em;
            margin-bottom: 0.35rem;
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .auth-link {
            color: var(--primary-action);
            font-weight: 800;
            text-decoration: none;
            transition: color 0.2s;
        }

        .auth-link:hover {
            color: var(--primary-action-hover);
            text-decoration: underline;
        }

        .form-label {
            font-weight: 800;
            font-size: 0.75rem;
            color: var(--primary-dark);
            margin-bottom: 0.4rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            background: var(--surface);
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            padding: 0.8rem 1rem;
            font-size: 0.9375rem;
            color: var(--primary-dark);
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-action);
            box-shadow: 0 0 0 4px rgba(3, 85, 243, 0.15);
        }

        .btn-primary {
            background-color: var(--primary-action);
            color: white;
            font-weight: 800;
            font-size: 0.9375rem;
            padding: 0.9rem;
            border-radius: 12px;
            transition: all 0.25s ease;
            width: 100%;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(3, 85, 243, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-action-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(3, 85, 243, 0.4);
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <a href="../../index.html" class="back-to-home-link">
            <span>← Back to Home</span>
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-logo-title">Sign in to DomiKnow</h1>
                <p class="auth-subtitle">
                    Enter your credentials to access your portal. Or
                    <a href="register.html" class="auth-link">create a new account</a>
                </p>
            </div>

            <div id="errorMessage" class="alert alert-danger hidden" style="border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; background: #fef2f2; border: 1px solid #fecaca; padding: 1rem; color: #b91c1c;">
                <span class="alert-text" style="font-size: 0.875rem; font-weight: 600;">Error message</span>
            </div>

            <form id="loginForm" novalidate style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address *</label>
                    <input id="email" name="email" type="email" required 
                           placeholder="name@example.com" class="form-input"
                           autocomplete="email">
                    <small class="form-error" id="email_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password *</label>
                    <div style="position: relative;">
                        <input id="password" name="password" type="password" required 
                               placeholder="••••••••" class="form-input"
                               autocomplete="current-password">
                        <button type="button" id="togglePassword" 
                                style="position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%); 
                                       background: none; border: none; cursor: pointer; font-size: 0.8125rem; 
                                       color: var(--primary-action); font-weight: 800;">
                            Show
                        </button>
                    </div>
                    <small class="form-error" id="password_error" style="color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block;"></small>
                </div>

                <div style="text-align: right; margin-top: -0.25rem;">
                    <a href="forgot-password.html" class="auth-link" style="font-size: 0.8125rem;">Forgot Password?</a>
                </div>

                <div class="form-group" style="margin-top: 0.5rem;">
                    <button type="submit" id="submitBtn" class="btn-primary">
                        Sign in
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../js/auth.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        
        // Toggle password visibility
        togglePasswordBtn.addEventListener('click', function() {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            this.textContent = type === 'password' ? 'Show' : 'Hide';
        });
        
        // Client-side validation
        function validateForm() {
            let isValid = true;
            
            // Clear previous errors
            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-input').forEach(el => {
                el.style.borderColor = '';
            });
            
            // Email validation
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                showFieldError('email', 'Email is required');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                showFieldError('email', 'Please enter a valid email address');
                isValid = false;
            }
            
            // Password validation
            const password = document.getElementById('password').value;
            if (!password) {
                showFieldError('password', 'Password is required');
                isValid = false;
            }
            
            return isValid;
        }
        
        function showFieldError(fieldId, message) {
            const errorEl = document.getElementById(`${fieldId}_error`);
            const inputEl = document.getElementById(fieldId);
            if (errorEl) errorEl.textContent = message;
            if (inputEl) inputEl.style.borderColor = '#ef4444';
        }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validate form
            if (!validateForm()) {
                return;
            }
            
            // Call existing handleLogin function
            await handleLogin(e);
        });
    </script>
</body>
</html>
